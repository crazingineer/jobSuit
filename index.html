    <script>
      // Compatibility shim for browser extensions (e.g. proxy/VPN extensions like Urban VPN, AdBlockers)
      // that attempt to intercept `window.fetch` using direct assignment (`window.fetch = ...`)
      // when running inside nested iframes where `window.fetch` only has a getter.
      (function() {
        try {
          var _currentFetch = window.fetch;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!descriptor || !descriptor.writable || !descriptor.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              }
            });
          }
        } catch (e) {
          // Non-blocking fallback
        }
      })();
    </script>
